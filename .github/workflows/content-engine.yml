name: Seth Content Engine

run-name: Seth Content Engine — ${{ inputs.dispatch_id || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate a preview without sending email"
        type: boolean
        default: false
      reuse_saved_discovery:
        description: "Reuse previously saved discovery state"
        type: boolean
        default: false
      dispatch_id:
        description: "Unique identifier supplied by the external scheduler"
        type: string
        default: ""
      dispatcher_test:
        description: "Verify the external scheduler without running the content pipeline"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: content-engine
  cancel-in-progress: false

jobs:
  dispatcher-test:
    if: github.event_name == 'workflow_dispatch' && inputs.dispatcher_test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Confirm external scheduler
        run: echo "The external scheduler authenticated and started this workflow."

  run:
    if: inputs.dispatcher_test != true
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "content-engine"
          git config user.email "content-engine@users.noreply.github.com"

      - name: Discover and rank videos
        if: inputs.reuse_saved_discovery != true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: npm run discover

      - name: Commit discovery state
        if: inputs.reuse_saved_discovery != true
        run: |
          git add state/engine.db
          git diff --staged --quiet || git commit -m "state: discovery ${{ github.run_id }}"
          git pull --rebase --autostash
          git push

      - name: Generate and deliver scripts
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_FROM: ${{ vars.GMAIL_FROM }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          mkdir -p out
          npm run publish

      - name: Prune old state
        run: npm run prune

      - name: Commit delivery state
        run: |
          git add state/engine.db
          git diff --staged --quiet || git commit -m "state: delivery ${{ github.run_id }}"
          git pull --rebase --autostash
          git push

      - name: Upload preview
        if: always() && github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: out/
          if-no-files-found: ignore

      - name: Alert on failure
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_FROM: ${{ vars.GMAIL_FROM }}
          FAILURE_REASON: "A step in the content engine workflow failed."
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run notify-failure
